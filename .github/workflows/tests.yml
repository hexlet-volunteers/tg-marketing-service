name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-key
      # Keep CI logs quiet: no DEBUG/INFO payloads (settings, API responses)
      # should ever end up in build output.
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install uv dependencies
        run: uv sync

      - name: Run backend linter
        run: uv run ruff check .

      - name: Run backend formatter
        run: uv run ruff format --check

      - name: Run backend type checker
        run: uv run mypy .

      - name: Install project and test deps
        run: |
          uv pip install --system .
          uv pip install --system pytest pytest-cov

      - name: Generate fixtures
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
        run: |
          uv run python3 -c "from tests.generate_fixtures import ModelAndFormFixtureGenerator; ModelAndFormFixtureGenerator().generate_all()"

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DB_URL }}
        run: |
          uv run pytest --cov=config --cov-report=xml
